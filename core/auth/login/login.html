<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EntelPrice</title>
    <!-- Recomendo gerar um favicon.ico real, mas mantive o seu PNG como fallback -->
    <link rel="shortcut icon" href="../../../public/images/Logo_Isolada.png" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <!-- Elementos da Animação de Fundo -->
    <div class="bg-animation">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>

    <!-- Cartão de Login -->
    <div class="login-card">
        
        <!-- Área da Logo no Topo -->
        <div class="logo-area">
            <!-- Substituído o placeholder pela sua imagem real -->
            <!-- Ajuste o caminho 'src' se a imagem estiver em outra pasta -->
            <img src="../../../public/images/Logo_Isolada.png" alt="EntelPrice Logo" class="logo-img">
            
            <h1>EntelPrice</h1>
        </div>

        <form action="#" method="POST">
            <div class="input-group">
                <label for="text">Login</label>
                <input type="text" id="text" placeholder="EX: meu.login" required>
            </div>

            <div class="input-group">
                <label for="password">Senha</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <div class="form-options">
                <a href="#" class="forgot-password">Esqueceu a senha?</a>
            </div>

            <button type="submit" class="btn-submit">Entrar</button>
        </form>

        <div class="form-footer">
            <p>Não tem uma conta? <a href="#">Solicite acesso</a></p>
        </div>
        
    </div>
<script src="login.js"></script>
</body>
</html>
